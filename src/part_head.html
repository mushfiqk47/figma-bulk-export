<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bulk export</title>
<style>
:root{--bg:#fff;--bg2:#f5f5f5;--ink:#000;--ink2:rgba(0,0,0,.62);--ink3:rgba(0,0,0,.42);--line:rgba(0,0,0,.12);--accent:#0d99ff;--danger:#e5484d;--ok:#2f9e44;--r:8px}
html.figma-dark,body.figma-dark{--bg:#2c2c2c;--bg2:#383838;--ink:#fff;--ink2:rgba(255,255,255,.74);--ink3:rgba(255,255,255,.46);--line:rgba(255,255,255,.16)}
*{box-sizing:border-box}[hidden]{display:none !important}html,body{height:100%}
body{margin:0;font:12px/1.5 Inter,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--figma-color-bg,var(--bg));color:var(--figma-color-text,var(--ink))}
.app{display:flex;flex-direction:column;height:100vh}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--figma-color-border,var(--line))}
.top-left{display:flex;align-items:center;gap:10px;min-width:0}
.back-btn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;padding:0;background:none;border:1px solid var(--figma-color-border,var(--line));border-radius:6px;color:var(--figma-color-text,var(--ink));cursor:pointer;flex:none}
.back-btn:hover{background:var(--figma-color-bg-hover,var(--bg2))}
.top h1{margin:0;font-size:13px;font-weight:600}.top p{margin:2px 0 0;color:var(--figma-color-text-secondary,var(--ink2))}
.badge{white-space:nowrap;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--figma-color-bg-secondary,var(--bg2));color:var(--figma-color-text-secondary,var(--ink2));border:1px solid var(--figma-color-border,var(--line))}
main{flex:1;overflow-y:auto;padding:12px 16px}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.link{background:none;border:0;padding:2px 0;color:var(--figma-color-text-brand,var(--accent));font:inherit;cursor:pointer}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--figma-color-border,var(--line));border-radius:var(--r);cursor:pointer;background:var(--figma-color-bg,var(--bg))}
.row input{accent-color:var(--accent);width:14px;height:14px;margin:0}
.row .m{min-width:0;flex:1}.row .n{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.row .s{display:block;color:var(--figma-color-text-tertiary,var(--ink3));font-size:11px}
.row .st{font-size:11px;color:var(--ink3);flex:none}.row.done .st{color:var(--ok)}.row.fail .st{color:var(--danger)}
.empty{padding:28px 12px;text-align:center;color:var(--figma-color-text-secondary,var(--ink2));border:1px dashed var(--figma-color-border-strong,var(--ink3));border-radius:var(--r)}
.g{margin:0 0 16px}.g>h2{margin:0 0 8px;font-size:11px;font-weight:600;color:var(--figma-color-text-secondary,var(--ink2))}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button,.scl button{border:1px solid var(--figma-color-border,var(--line));background:var(--figma-color-bg,var(--bg));color:inherit;font:inherit;padding:7px 0;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"],.scl button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:600}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;border:1px solid var(--figma-color-border,var(--line));border-radius:var(--r)}
.sw{position:relative;width:32px;height:18px;flex:none;border-radius:99px;border:0;background:var(--ink3);cursor:pointer;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff}
.sw[aria-checked="true"]{background:var(--accent)}.sw[aria-checked="true"]::after{left:16px}
.hint{margin:6px 0 0;font-size:11px;color:var(--figma-color-text-tertiary,var(--ink3))}
.scl{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.scl button:disabled{opacity:.4;cursor:default}
.radio{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--figma-color-border,var(--line));border-radius:var(--r);margin-bottom:6px;cursor:pointer}
.radio input{accent-color:var(--accent);margin:2px 0 0}
.manifest{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--figma-color-text-secondary,var(--ink2))}
.manifest li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;border-radius:99px;background:var(--figma-color-bg-secondary,var(--bg2));border:1px solid var(--figma-color-border,var(--line));overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent)}
.status{margin:8px 0 12px;color:var(--figma-color-text-secondary,var(--ink2))}
.failbox{margin-top:12px;padding:10px;border:1px solid var(--danger);border-radius:var(--r)}
.failbox h3{margin:0 0 6px;font-size:12px;color:var(--danger)}.failbox ul{margin:0;padding-left:18px}
footer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--figma-color-border,var(--line))}
.btn{flex:1;font:inherit;font-weight:500;padding:9px 12px;border-radius:6px;cursor:pointer;border:1px solid var(--figma-color-border,var(--line));background:var(--figma-color-bg,var(--bg));color:inherit}
.btn.primary{background:var(--figma-color-bg-brand,var(--accent));border-color:transparent;color:#fff}
.btn:disabled{opacity:.45;cursor:default}.btn.secondary{flex:0 0 auto;padding-left:16px;padding-right:16px}
@media (prefers-color-scheme:dark){:root:not(.figma-light):not(.figma-dark){--bg:#2c2c2c;--bg2:#383838;--ink:#fff;--ink2:rgba(255,255,255,.74);--ink3:rgba(255,255,255,.46);--line:rgba(255,255,255,.16)}}
</style>
</head>
<body>
