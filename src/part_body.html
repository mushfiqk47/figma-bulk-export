<div class="app">
<header class="top"><div class="top-left"><button type="button" class="back-btn" id="btnNavBack" aria-label="Back to selection" title="Back" hidden><svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M7.5 2.5L4 6L7.5 9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="logo-mark" id="brandLogo" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M288 64H117.333C87.8781 64 64 87.8781 64 117.333V288C64 317.455 87.8781 341.333 117.333 341.333H288C317.455 341.333 341.333 317.455 341.333 288V117.333C341.333 87.8781 317.455 64 288 64Z" fill="#D9D9D9"/><path d="M358 117H187.333C157.878 117 134 140.878 134 170.333V341C134 370.455 157.878 394.333 187.333 394.333H358C387.455 394.333 411.333 370.455 411.333 341V170.333C411.333 140.878 387.455 117 358 117Z" fill="#FF4B00"/><path d="M189 281L285 185M285 259.667V185H210.333" stroke="white" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div><h1>Bulk export</h1><p id="subtitle">Select frames on the canvas to export.</p></div></div><span class="badge" id="countBadge">0 selected</span></header>
<main>
<section id="screenSelect">
<div class="tools" id="selTools"><span id="selNote" style="color:var(--ink2)">Showing the canvas selection only.</span><span style="flex:1"></span><button class="link" id="selNone">Clear</button></div>
<div class="list" id="frameList"></div>
<div class="empty" id="emptyState" hidden>Select one or more frames on the canvas to get started.</div>
<p class="hint" id="skipHint" hidden></p>
</section>
<section id="screenSettings" hidden>
<div class="g"><h2>File type</h2><div class="seg" id="fmtSeg">
<button data-fmt="PNG" aria-pressed="true">PNG</button><button data-fmt="JPG" aria-pressed="false">JPG</button><button data-fmt="SVG" aria-pressed="false">SVG</button><button data-fmt="PDF" aria-pressed="false">PDF</button>
</div></div>
<div class="g" id="pdfGroup" hidden><h2>PDF mode</h2>
<div class="pdf-grid">
<label class="radio"><input type="radio" name="pdfmode" value="single" checked><span><b>One PDF for all frames</b><br><span style="color:var(--ink2)">Frames become pages in selection order.</span></span></label>
<label class="radio"><input type="radio" name="pdfmode" value="each"><span><b>One PDF per frame</b><br><span style="color:var(--ink2)">Each frame downloads as its own file.</span></span></label>
</div>
</div>
<div class="g" id="qualityGroup"><h2>Scale</h2>
<p class="hint" id="qualityHint" style="margin:0 0 8px">Scale applies to PNG and JPG only.</p>
<div class="scl" id="scaleRow">
<button data-scale="none" aria-pressed="false">None</button><button data-scale="0.5" aria-pressed="false">0.5x</button><button data-scale="1" aria-pressed="false">1x</button><button data-scale="2" aria-pressed="true">2x</button><button data-scale="3" aria-pressed="false">3x</button><button data-scale="4" aria-pressed="false">4x</button>
</div></div>
</section>
<section id="screenProgress" hidden>
<div class="bar"><i id="barFill"></i></div>
<p class="status" id="statusLine">Exporting…</p>
<div class="failbox" id="failBox" hidden><h3>Some frames failed</h3><ul id="failList"></ul></div>
</section>
</main>
<footer id="footSelect"><button class="btn primary" id="btnContinue" disabled>Continue</button></footer>
<footer id="footSettings" hidden><button class="btn primary" id="btnExport">Export</button></footer>
<footer id="footDone" hidden><button class="btn secondary" id="btnBack2">Back</button><button class="btn primary" id="btnMore">Export more</button></footer>
</div>
